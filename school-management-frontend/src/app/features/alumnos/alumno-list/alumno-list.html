
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Alumnos</h2>
    <button class="btn btn-primary" routerLink="/alumnos/nuevo">Nuevo Alumno</button>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <table *ngIf="!isLoading && alumnos.length > 0" class="table table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Edad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let alumno of alumnos">
        <td>{{ alumno.id }}</td>
        <td>{{ alumno.nombre }}</td>
        <td>{{ alumno.apellido }}</td>
        <td>{{ alumno.correo }}</td>
        <td>{{ alumno.edad }}</td>
        <td>
          <button (click)="editarAlumno(alumno.id)" class="btn btn-warning btn-sm me-2">Editar</button>
          <button (click)="eliminarAlumno(alumno.id)" class="btn btn-danger btn-sm">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && alumnos.length === 0" class="alert alert-warning text-center">
    No se encontraron alumnos registrados en el sistema.
  </div>
</div>
